<?xml version="1.0" encoding="UTF-8"?>
<!--
  MacTokenBridge app icon, 32 px rendition (also 16 px @2x). One pixel is 32 units here.
  Same picture as AppIcon.svg with no hangers and with the tile, the chip, the deck and the
  towers snapped to whole pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#454D66"/>
			<stop offset="1" stop-color="#12141D"/>
		</linearGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FFEDB5"/>
			<stop offset="0.45" stop-color="#F6C14C"/>
			<stop offset="1" stop-color="#CF8C1C"/>
		</linearGradient>
		<filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="16"/>
		</filter>
		<clipPath id="chipClip">
			<rect x="224" y="256" width="576" height="512" rx="112"/>
		</clipPath>
	</defs>
	<rect x="104" y="116" width="816" height="816" rx="188" fill="#000000" opacity="0.4" filter="url(#tileShadow)"/>
	<rect x="96" y="96" width="832" height="832" rx="188" fill="url(#tile)"/>
	<rect x="224" y="256" width="576" height="512" rx="112" fill="url(#gold)"/>
	<g clip-path="url(#chipClip)" fill="none" stroke="#7A4E05" stroke-linejoin="round">
		<path stroke-width="32" d="M224 624H800M400 336V768M624 336V768"/>
		<path stroke-width="30" stroke-linecap="round" d="M400 336Q512 640 624 336M400 336Q344 540 224 600M624 336Q680 540 800 600"/>
	</g>
</svg>
